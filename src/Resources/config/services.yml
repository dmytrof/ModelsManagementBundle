services:
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        public: false       # Allows optimizing the container by removing unused services; this also means

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    # Doctrine listeners in EventSubscriber/ are registered by their #[AsDoctrineListener] attributes (autoconfigure)
    Dmytrof\ModelsManagementBundle\:
        resource: '../../*'
        exclude: '../../{DependencyInjection,Entity,Event,Exception,Model,Resources}'

    # Reads Gedmo mapping from PHP attributes (doctrine/annotations is not required)
    dmytrof_models_management.gedmo.attribute_reader:
        class: Gedmo\Mapping\Driver\AttributeReader

    Gedmo\Timestampable\TimestampableListener:
        tags:
            - { name: doctrine.event_listener, event: prePersist }
            - { name: doctrine.event_listener, event: onFlush }
            - { name: doctrine.event_listener, event: loadClassMetadata }
        calls:
            - [ setAnnotationReader, [ "@dmytrof_models_management.gedmo.attribute_reader" ] ]

    Gedmo\Blameable\BlameableListener:
        tags:
            - { name: doctrine.event_listener, event: prePersist }
            - { name: doctrine.event_listener, event: onFlush }
            - { name: doctrine.event_listener, event: loadClassMetadata }
        calls:
            - [ setAnnotationReader, [ "@dmytrof_models_management.gedmo.attribute_reader" ] ]
